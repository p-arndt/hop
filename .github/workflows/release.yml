name: Build and Publish Release
permissions:
  contents: write

# Two release runs uploading assets to the same tag would race; queue them
# instead (never cancel — a half-cancelled release could leave a tag with
# partial assets).
concurrency:
  group: release
  cancel-in-progress: false

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.2.0 or 0.2.0-beta.1 ("v" prefix optional). Leave empty to use the VERSION file with a -pre.<run> suffix'
        required: false
        type: string
      prerelease:
        description: 'Mark as a GitHub pre-release'
        required: false
        type: boolean
        default: true
      draft:
        description: 'Create as a draft so you can review/publish it manually'
        required: false
        type: boolean
        default: true

jobs:
  # hop is Windows-only (Windows named pipes), so the binaries must be built on
  # a Windows runner — no cross-compile from Linux. This job resolves the
  # version, builds both Windows arches, and uploads the archives as an
  # artifact for the release job to publish.
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
      TAG: ${{ steps.version.outputs.TAG }}
      PRERELEASE: ${{ steps.version.outputs.PRERELEASE }}
      DRAFT: ${{ steps.version.outputs.DRAFT }}

    # Third-party actions are pinned to full commit SHAs, not tags: tags are
    # mutable and could be repointed to malicious code under us. Dependabot
    # (see .github/dependabot.yml) keeps these pins current.
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Reads the Go version straight from go.mod so it never drifts.
          go-version-file: go.mod
          cache: true

      - name: Determine version
        id: version
        shell: bash
        # The version input reaches this script through env, never inline
        # ${{ }} interpolation into the script body — interpolated input is
        # how GitHub Actions script injection happens.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            if [ -z "$VERSION" ]; then
              # No version given: derive one from the VERSION file, suffixed with
              # the semver pre-release identifier "-pre.<run number>" so each
              # manual run gets its own, ever-incrementing version.
              VERSION="$(cat VERSION)-pre.${{ github.run_number }}"
            fi
            VERSION="${VERSION#v}"
            PRERELEASE="${{ inputs.prerelease }}"
            DRAFT="${{ inputs.draft }}"
          else
            # Tag push: v0.2.0 -> 0.2.0.
            VERSION="${GITHUB_REF_NAME#v}"
            DRAFT=false
            # Semver pre-release tags (e.g. v0.2.0-beta.1) are flagged automatically.
            if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          fi
          # Bounded, semver-ish charset: keeps the version safe to splice into
          # file names and the tag.
          if ! [[ "$VERSION" =~ ^[0-9][0-9A-Za-z.+-]{0,63}$ ]]; then
            echo "::error::version '$VERSION' is not a valid release version" >&2
            exit 1
          fi
          echo "VERSION=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "TAG=v$VERSION"      >> "$GITHUB_OUTPUT"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "DRAFT=$DRAFT"       >> "$GITHUB_OUTPUT"

      - name: Test
        # Nothing gets built or published from a commit that fails vet + tests.
        run: |
          go vet ./...
          go test ./...

      - name: Build static binaries (Windows amd64 + arm64)
        # CGO_ENABLED=0 links no libc -> fully static, portable binaries.
        # -trimpath drops local paths; -s -w strips symbols/DWARF. Version
        # metadata is injected into internal/buildinfo via -X.
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (git rev-parse --short HEAD).Trim()
          $date = (Get-Date -AsUTC -Format o)
          $ldflags = "-s -w " +
            "-X hop/internal/buildinfo.Version=$env:VERSION " +
            "-X hop/internal/buildinfo.Commit=$commit " +
            "-X hop/internal/buildinfo.Date=$date"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          foreach ($arch in 'amd64', 'arm64') {
            $env:GOARCH = $arch
            Write-Host "-> building windows/$arch"
            if (Test-Path stage) { Remove-Item -Recurse -Force stage }
            New-Item -ItemType Directory -Force -Path stage | Out-Null
            go build -trimpath -ldflags "$ldflags" -o stage/hop.exe .
            if ($LASTEXITCODE -ne 0) { throw "build failed for windows/$arch" }
            $name = "hop_${env:VERSION}_windows_$arch"
            Compress-Archive -Path stage/hop.exe -DestinationPath "dist/$name.zip" -Force
          }

          # Checksums over the archives (computed before the file itself exists).
          $lines = Get-ChildItem dist -Filter *.zip | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          Set-Content -Path "dist/hop_${env:VERSION}_checksums.txt" -Value $lines -NoNewline:$false
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@89ef406dd8d7e03cfd12d9e0a4a378f454709029 # v4.4.3
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Changelog generation (orhun/git-cliff-action) is a Docker action, which
  # only runs on Linux — so publishing happens on ubuntu after downloading the
  # Windows-built archives.
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist
          path: dist

      - name: Generate changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          # On a tag push the tag already exists, so --latest covers it. On a
          # manual run no tag exists yet (action-gh-release creates it below),
          # so fall back to --unreleased to cover commits since the last tag.
          args: ${{ github.event_name == 'workflow_dispatch' && '--unreleased --strip all' || '--latest --strip all' }}
        env:
          OUTPUT: CHANGELOG_BODY.md

      - name: Assemble release notes
        shell: bash
        run: |
          CUR="${{ needs.build.outputs.TAG }}"
          if [ "${{ needs.build.outputs.PRERELEASE }}" = "true" ]; then
            echo "## 🧪 Pre-release $CUR" > RELEASE_NOTES.md
          else
            echo "## 🚀 Release $CUR" > RELEASE_NOTES.md
          fi
          echo "" >> RELEASE_NOTES.md
          cat CHANGELOG_BODY.md >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.build.outputs.TAG }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.build.outputs.PRERELEASE }}
          draft: ${{ needs.build.outputs.DRAFT }}
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
